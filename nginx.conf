server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;
    client_max_body_size 64M;

    # -----------------------------------------------------------------------
    # SEO: Rotas de anúncio /{slug}/{id} → Laravel (para injetar og:title etc.)
    # O WhatsApp/crawler lê o HTML estático e precisa ver as tags OG reais.
    # Sem esta regra, o nginx serve react/index.html com __OG_TITLE__ literal.
    # -----------------------------------------------------------------------
    location ~ ^/[^/]+/[0-9]+/?$ {
        # Exclui rotas internas da SPA que têm formato /{nome}/{número}
        # (ex: /mensagens/42, /editar-anuncio/10, /redefinir-senha/token)
        if ($uri ~* "^/(mensagens|editar-anuncio|redefinir-senha|password)/") {
            rewrite ^ /react/index.html last;
        }
        # Todo o resto com formato /{slug}/{id} vai para o Laravel
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Rotas SEO explícitas: /category/... e /anuncio/... → Laravel
    location ~ ^/(category|anuncio)(/.*)?$ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param HTTPS off;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 600s;
    }

    location ~ /\.ht {
        deny all;
    }
}